name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # See ci.yml: `cooper` is a `file:../node-cooper` dependency.
      - name: Check out node-cooper next to this repository
        uses: actions/checkout@v4
        with:
          repository: joetjen/node-cooper
          path: node-cooper

      - name: Move node-cooper beside this repository
        run: mv node-cooper ../node-cooper

      # `cooper-config` is unpublished too: `file:../node-cooper-config`.
      - name: Check out node-cooper-config next to this repository
        uses: actions/checkout@v4
        with:
          repository: joetjen/node-cooper-config
          path: node-cooper-config

      - name: Move node-cooper-config beside this repository
        run: mv node-cooper-config ../node-cooper-config

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build docs
        run: npm run docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: doc

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
